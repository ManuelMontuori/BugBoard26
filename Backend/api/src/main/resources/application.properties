# CONFIGURAZIONE DATABASE (Dinamica per Docker e AWS)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bugboardDB}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:manuel}

# HIBERNATE & PERFORMANCE
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.open-in-view=false

# AWS COGNITO (Centralizzato con le variabili)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.${AWS_REGION:eu-south-1}.amazonaws.com/${COGNITO_USER_POOL_ID:eu-south-1_aA4G67UT3}
aws.cognito.user-pool-id=${COGNITO_USER_POOL_ID:eu-south-1_aA4G67UT3}
aws.region=${AWS_REGION:eu-south-1}

# PROFILO ATTIVO
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}